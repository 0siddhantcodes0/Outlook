# Sends the leverage playbook report to Telegram.
#
# There is no schedule here: in October 2026 GitHub started this job's
# scheduled runs 2.5-6 hours late, after the market had closed. Instead an
# outside clock (a Claude routine) starts it through the API at about
# 9:45 AM and 3:33 PM Toronto time on weekdays:
#   POST /repos/{owner}/{repo}/actions/workflows/playbook-report.yml/dispatches
#   {"ref": "main"}
# Runs started that way begin within seconds. Actions -> Run workflow works too.
#
# Repository secrets: TELEGRAM_BOT_TOKEN, TELEGRAM_CHAT_ID, and optionally
# HOLDINGS_CSV (contents of your holdings file). Variables: PLAYBOOK_ENABLED
# (true) and optionally PLAYBOOK_PRESET and PLAYBOOK_ALSO (a preset to preview, or none).
name: playbook-report
on:
  workflow_dispatch:
jobs:
  report:
    runs-on: ubuntu-latest
    if: ${{ vars.PLAYBOOK_ENABLED == 'true' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install yfinance pandas numpy
      # ALSO adds a short preview of a second preset (default design-f; "none" turns it off)
      - run: |
          extra=""
          if [ "$ALSO" != "none" ] && [ "$ALSO" != "${PRESET:-aggressive}" ]; then extra="--also $ALSO"; fi
          python playbook.py report --telegram --preset "${PRESET:-aggressive}" $extra
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          HOLDINGS_CSV: ${{ secrets.HOLDINGS_CSV }}
          PRESET: ${{ vars.PLAYBOOK_PRESET }}
          ALSO: ${{ vars.PLAYBOOK_ALSO || 'design-f' }}
